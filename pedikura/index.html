<!DOCTYPE html>
<html lang="cs" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedikúra u Stonožky | Lucie Stožková – Uherský Brod</title>
  <meta name="description" content="Vítejte v salonu Pedikúra u Stonožky v Uherském Brodě (náměstí 1. máje 1571). Přístrojová pedikúra, manikúra, gel lak a kolagenové solárium s online rezervací." />

  <!-- Google Fonts: Lora & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --salon-green: #629632;
      --salon-green-dark: #4E7A26;
      --salon-green-light: #EEF5E6;
      --bg-white: #FFFFFF;
      --bg-soft: #F7F9F5;
      --text-dark: #222920;
      --text-muted: #555E52;
      --star-gold: #F5B82E;
      --border-soft: rgba(98, 150, 50, 0.16);
      --shadow-card: 0 12px 32px -6px rgba(34, 41, 32, 0.08);
      --radius-lg: 22px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-white);
      color: var(--text-dark);
      line-height: 1.65;
      -webkit-tap-highlight-color: transparent;
    }

    h1, h2, h3, .serif-heading {
      font-family: 'Lora', Georgia, serif;
      line-height: 1.2;
      color: var(--text-dark);
    }

    .container {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ========================
       1. HLAVIČKA (STICKY NAVBAR)
       ======================== */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 76px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      z-index: 1000;
      display: flex;
      align-items: center;
      transition: var(--transition);
    }

    .navbar.scrolled {
      height: 66px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-dark);
      z-index: 1002;
    }

    .brand-logo-circle {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, #9EC649 0%, #629632 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(98, 150, 50, 0.25);
      flex-shrink: 0;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-family: 'Lora', serif;
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.1;
      color: var(--text-dark);
    }

    .brand-sub {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-dark);
      font-weight: 500;
      font-size: 0.92rem;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--salon-green);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-green {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 999px;
      background: var(--salon-green);
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.94rem;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(98, 150, 50, 0.28);
      transition: var(--transition);
    }

    .btn-green:hover {
      background: var(--salon-green-dark);
      transform: translateY(-2px);
    }

    .btn-outline {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 22px;
      border-radius: 999px;
      background: #FFFFFF;
      color: var(--text-dark);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.92rem;
      border: 1.5px solid rgba(98, 150, 50, 0.35);
      transition: var(--transition);
    }

    .btn-outline:hover {
      border-color: var(--salon-green);
      color: var(--salon-green);
      background: var(--salon-green-light);
    }

    /* Mobilní Hamburger Menu */
    .hamburger-btn {
      display: none;
      width: 42px;
      height: 42px;
      background: transparent;
      border: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      z-index: 1002;
    }

    .hamburger-line {
      width: 24px;
      height: 2px;
      background: var(--text-dark);
      border-radius: 2px;
      transition: var(--transition);
    }

    .hamburger-btn.active .hamburger-line:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }
    .hamburger-btn.active .hamburger-line:nth-child(2) {
      opacity: 0;
    }
    .hamburger-btn.active .hamburger-line:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    .mobile-drawer {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: #FFFFFF;
      padding: 88px 24px 28px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
      z-index: 999;
      transform: translateY(-105%);
      opacity: 0;
      pointer-events: none;
      transition: var(--transition);
    }

    .mobile-drawer.open {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .mobile-drawer ul {
      list-style: none;
      margin-bottom: 20px;
    }

    .mobile-drawer li a {
      display: flex;
      justify-content: space-between;
      padding: 13px 4px;
      border-bottom: 1px solid #F0F3EE;
      color: var(--text-dark);
      text-decoration: none;
      font-family: 'Lora', serif;
      font-size: 1.3rem;
      font-weight: 600;
    }

    /* ========================
       2. OSOBNÍ HERO SEKCE
       ======================== */
    .hero-welcome {
      padding: 120px 0 76px;
      background: linear-gradient(180deg, #FFFFFF 0%, #F7FAF4 100%);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 48px;
      align-items: center;
    }

    .lucie-photo-card {
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: 0 20px 45px rgba(34, 41, 32, 0.14);
      aspect-ratio: 4 / 4.3;
      background: #E8EFE2;
    }

    .lucie-photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    .lucie-badge {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      padding: 12px 16px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.84rem;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    }

    .hero-logo-emblem {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: var(--salon-green-light);
      padding: 8px 16px 8px 10px;
      border-radius: 999px;
      margin-bottom: 18px;
      border: 1px solid var(--border-soft);
    }

    .hero-welcome h1 {
      font-size: clamp(2.25rem, 4vw, 3.35rem);
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--text-dark);
    }

    .hero-intro-bold {
      font-size: 1.12rem;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 14px;
    }

    .hero-text {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 14px;
    }

    .hero-signature {
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--salon-green);
      margin: 18px 0 28px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    /* ========================
       3. SEKCE „NECHTE SE ROZMAZLOVAT“
       ======================== */
    .pamper-banner {
      padding: 64px 0;
      text-align: center;
      background: #FFFFFF;
      border-top: 1px solid #EEF2EA;
    }

    .pamper-banner h2 {
      font-size: clamp(2rem, 3.6vw, 2.8rem);
      margin-bottom: 16px;
    }

    .pamper-banner p {
      max-width: 680px;
      margin: 0 auto;
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    /* ========================
       4. ZELENÁ SEKCE SALÓNU (FARMONA, PROSTŘEDÍ, SOLÁRIUM)
       ======================== */
    .salon-green-section {
      background-color: var(--salon-green);
      color: #FFFFFF;
      padding: 84px 0;
    }

    .salon-two-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 36px;
      margin-bottom: 64px;
    }

    .salon-feature-card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: var(--radius-lg);
      padding: 28px;
      display: flex;
      flex-direction: column;
    }

    .feature-img-box {
      width: 100%;
      aspect-ratio: 4 / 3.4;
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 24px;
      background: #4E7A26;
    }

    .feature-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .salon-feature-card h3 {
      color: #FFFFFF;
      font-size: 1.75rem;
      margin-bottom: 14px;
    }

    .salon-feature-card p {
      color: rgba(255, 255, 255, 0.92);
      font-size: 0.96rem;
      margin-bottom: 12px;
    }

    /* Solárium blok uvnitř zelené sekce */
    .solarium-highlight {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-lg);
      padding: 40px;
      display: grid;
      grid-template-columns: 0.95fr 1.05fr;
      gap: 40px;
      align-items: center;
    }

    .solarium-img-box {
      border-radius: var(--radius-md);
      overflow: hidden;
      aspect-ratio: 1 / 1;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.2);
      background: #3A251E;
    }

    .solarium-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .solarium-highlight h3 {
      color: #FFFFFF;
      font-size: 2.1rem;
      margin-bottom: 16px;
    }

    .solarium-highlight p {
      color: rgba(255, 255, 255, 0.92);
      font-size: 0.98rem;
      margin-bottom: 14px;
    }

    .solarium-perks {
      list-style: none;
      display: grid;
      gap: 10px;
      margin: 22px 0 28px;
    }

    .solarium-perks li {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 0.96rem;
    }

    .btn-white-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 26px;
      border-radius: 999px;
      background: #FFFFFF;
      color: var(--salon-green-dark);
      font-weight: 700;
      font-size: 0.94rem;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-white-pill:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
    }

    /* ========================
       5. REZERVAČNÍ SYSTÉM (CAL.COM + CALLBACK)
       ======================== */
    .booking-section {
      padding: 84px 0;
      background: var(--bg-soft);
    }

    .section-header {
      text-align: center;
      max-width: 660px;
      margin: 0 auto 44px;
    }

    .section-eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--salon-green);
      margin-bottom:
